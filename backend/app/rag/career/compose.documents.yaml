# Overlay for the recommendation API with server-side Korean and English OCR.
services:
  api:
    image: unipath-career-documents:local
    build:
      dockerfile: backend/app/rag/career/Dockerfile
    command: ["uvicorn", "app.rag.career.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-credentials.json
      CAREER_GREENHOUSE_BOARD: ${CAREER_GREENHOUSE_BOARD-sendbird}
      SARAMIN_ACCESS_KEY: ${SARAMIN_ACCESS_KEY:-}
      WORK24_AUTH_KEY: ${WORK24_AUTH_KEY:-}
    volumes:
      - ${VERTEX_CREDENTIALS_FILE:-/dev/null}:/run/secrets/vertex-credentials.json:ro
