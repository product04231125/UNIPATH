[project]
name = "unipath-backend"
version = "0.1.0"
description = "UniversityPath AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.142.1,<0.143",
  "uvicorn>=0.40,<1",
  "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.20,<2",
  "pydantic-settings>=2.15,<3",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "httpx2>=2,<3", "ruff>=0.16,<0.17"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires migrated PostgreSQL with pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
