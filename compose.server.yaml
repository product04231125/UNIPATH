# Use a different Compose project and env file for each domain (see docs/releases.md).
services:
  db:
    restart: unless-stopped
  api:
    restart: unless-stopped
    image: ${API_IMAGE:?Set API_IMAGE to the verified local backend image ID}
    build: !reset null
    pull_policy: never
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-credentials.json
    volumes:
      # Unset keeps an empty file: Gemini stays off without VERTEX_* settings.
      - ${VERTEX_CREDENTIALS_FILE:-/dev/null}:/run/secrets/vertex-credentials.json:ro
  migrate:
    image: ${API_IMAGE:?Set API_IMAGE to the verified local backend image ID}
    build: !reset null
    pull_policy: never
  web:
    restart: unless-stopped
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the verified local web image ID}
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
        aliases: ["${WEB_NETWORK_ALIAS:?Set WEB_NETWORK_ALIAS}"]
      gateway:
        aliases: ["${WEB_NETWORK_ALIAS:?Set WEB_NETWORK_ALIAS}"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-pawmaru-edge}
