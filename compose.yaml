name: unipath

x-backend: &backend
  image: unipath-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    APP_ENV: ${APP_ENV:-local}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-unipath}
    POSTGRES_USER: ${POSTGRES_USER:-unipath}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unipath}
      POSTGRES_USER: ${POSTGRES_USER:-unipath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  test:
    <<: *backend
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    image: unipath-backend-test:local
    environment:
      <<: *backend-environment
      RUN_DB_TESTS: "1"
    command: ["pytest", "-q"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
