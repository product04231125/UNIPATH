limit_req_zone $binary_remote_addr zone=school_queries:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/assistant/queries {
        limit_req zone=school_queries burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }

    location = /api/v1/health/ready {
        proxy_pass http://api:8000;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_register burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /api/v1/admin/knowledge-revisions {
        access_log off;
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/admin/knowledge-revisions/ {
        access_log off;
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /api/v1/admin/rule-programs {
        access_log off;
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/admin/rule-programs/ {
        access_log off;
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/admin/ {
        client_max_body_size 64k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/me/ {
        access_log off;
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/catalog/ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location /api/ {
        return 404;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"잠시 후 다시 질문해 주세요.","field_errors":[],"request_id":"$request_id"}}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
