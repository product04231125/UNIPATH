server {
    listen 80;
    listen [::]:80;
    server_name staging-unipath.duckdns.org unipath.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-unipath.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/unipath.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipath.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://unipath-staging-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name unipath.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/unipath.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipath.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://unipath-product-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
