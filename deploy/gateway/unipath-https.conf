server {
    listen 80;
    listen [::]:80;
    server_name staging-unipath.duckdns.org unipath.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging-unipath.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/unipath.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipath.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The application proxy retains each route's smaller limit.
    client_max_body_size 2m;
    error_page 413 = @staging_payload_too_large;
    location ~ ^/api/v1/(me|admin)/official-record-(sources|batches)(?:/|$) {
        access_log off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $unipath_upstream unipath-staging-web;
        proxy_pass http://$unipath_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $unipath_upstream unipath-staging-web;
        proxy_pass http://$unipath_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @staging_payload_too_large {
        access_log off;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"HTTP_ERROR","message":"자료가 너무 큽니다. 묶음을 나누어 다시 전송해 주세요.","field_errors":[],"request_id":"$request_id"}}';
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name unipath.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/unipath.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unipath.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $unipath_upstream unipath-product-web;
        proxy_pass http://$unipath_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
