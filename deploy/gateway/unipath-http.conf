# Bootstrap HTTP routing, before the first certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name staging-unipath.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $unipath_upstream unipath-staging-web;
        proxy_pass http://$unipath_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name unipath.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $unipath_upstream unipath-product-web;
        proxy_pass http://$unipath_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
