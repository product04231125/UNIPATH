server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    # Selected files (base64 of up to 8 MiB) with server-side OCR and model calls.
    location = /api/v1/me/job-analyses {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/me/job-recommendations {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/me/personalized-guidance {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/me/career-gap-analyses {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/me/writing-drafts {
        client_max_body_size 12m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/v1/me/materials {
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
