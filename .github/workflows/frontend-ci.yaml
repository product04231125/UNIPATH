name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unipath-flutter
          key: flutter-3.47.6-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Flutter
        shell: bash
        run: |
          if [ ! -d "$RUNNER_TEMP/unipath-flutter/.git" ]; then
            git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/unipath-flutter"
          fi
          echo "$RUNNER_TEMP/unipath-flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test Flutter
        working-directory: frontend
        shell: bash
        run: |
          flutter config --no-analytics
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
