name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'docs/sources/**'
      - 'docs/api/**'
      - 'compose*.yaml'
      - '.env.example'
      - '.dockerignore'
      - 'deploy/gateway/**'
      - 'deploy/preview/**'
      - '.github/workflows/backend-ci.yaml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'docs/sources/**'
      - 'docs/api/**'
      - 'compose*.yaml'
      - '.env.example'
      - '.dockerignore'
      - 'deploy/gateway/**'
      - 'deploy/preview/**'
      - '.github/workflows/backend-ci.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen
      - name: Lint and format
        working-directory: backend
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Unit tests
        working-directory: backend
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        run: uv run --frozen pytest -q -m 'not integration'
      - name: RAG extraction and development evaluation
        working-directory: backend
        run: |
          uv run --frozen python -m app.rag.ingestion
          uv run --frozen python -m app.rag.evals
      - name: Prepare synthetic local settings
        run: cp .env.example .env
      - name: Build and start common environment
        run: docker compose -f compose.yaml -f compose.rag.yaml up --build --wait --wait-timeout 120
      - name: Database integration and container tests
        run: docker compose -f compose.yaml -f compose.rag.yaml --profile test run --build --rm test
      - name: Check model and migration agreement
        run: docker compose -f compose.yaml -f compose.rag.yaml run --rm --no-deps migrate alembic check
      - name: Smoke check
        run: python3 backend/scripts/smoke_api.py
      - name: Verify staged requests through both gateway layers
        run: python3 backend/scripts/smoke_gateway_proxy.py
      - name: Verify backup restoration with synthetic data
        working-directory: backend
        run: uv run --frozen python -m scripts.smoke_db_backup
      - name: Container status
        if: always()
        run: docker compose -f compose.yaml -f compose.rag.yaml ps -a
      - name: Clean up CI environment
        if: always()
        run: docker compose -f compose.yaml -f compose.rag.yaml down --volumes
